name: Family reminders
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub may delay a few minutes); public repo = free minutes
  workflow_dispatch:
concurrency: { group: nudges, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: .github/push/package-lock.json }
      - run: npm ci --omit=dev
        working-directory: .github/push
      - run: node nudge.mjs
        working-directory: .github/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
