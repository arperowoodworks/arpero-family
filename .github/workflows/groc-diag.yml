name: Groc diag (one-off, read-only)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: .github/push/package-lock.json }
      - run: npm ci --omit=dev
        working-directory: .github/push
      - run: node groc-diag.mjs
        working-directory: .github/push
        env: { FIREBASE_SA: '${{ secrets.FIREBASE_SA }}' }
