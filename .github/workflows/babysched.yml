name: Baby schedule alerts
on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may start runs a few minutes late; the script waits in-job for alerts due in the next 11 min
  workflow_dispatch:
    inputs:
      mode: { description: 'normal | dry (list only) | test (send one test alert)', default: normal }
concurrency: { group: babysched, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: .github/push/package-lock.json }
      - run: npm ci --omit=dev
        working-directory: .github/push
      - run: node babysched.mjs
        working-directory: .github/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          DRY: ${{ inputs.mode == 'dry' && '1' || '' }}
          TEST: ${{ inputs.mode == 'test' && '1' || '' }}
