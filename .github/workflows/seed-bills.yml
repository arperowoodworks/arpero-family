name: Seed bills (one-off)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: .github/push/package-lock.json }
      - run: npm ci --omit=dev
        working-directory: .github/push
      - run: node seed-bills.mjs
        working-directory: .github/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          BILLS_SEED: ${{ secrets.BILLS_SEED }}
      - run: tar c bills-backup.json result.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BK -out out.enc && rm bills-backup.json result.json
        working-directory: .github/push
        env: { BK: '${{ secrets.BACKUP_KEY }}' }
      - uses: actions/upload-artifact@v4
        with: { name: seed-out, path: .github/push/out.enc, retention-days: 1 }
