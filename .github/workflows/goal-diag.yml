name: Goal diag (one-off)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: .github/push/package-lock.json }
      - run: npm ci --omit=dev
        working-directory: .github/push
      - run: node goal-diag.mjs
        working-directory: .github/push
        env: { FIREBASE_SA: '${{ secrets.FIREBASE_SA }}' }
      - run: openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BK -in settings-backup.json -out out.enc && rm settings-backup.json
        working-directory: .github/push
        env: { BK: '${{ secrets.BACKUP_KEY }}' }
      - uses: actions/upload-artifact@v4
        with: { name: diag-out, path: .github/push/out.enc, retention-days: 1 }
