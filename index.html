<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arpero Family"><meta name="theme-color" content="#0f2d52">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon-32.png">
<title>Arpero Family</title>
<style>
:root{--g:#0f2d52;--bg:#f5f7fa;--teal:#1f6fa8;--gold:#f7a325;--c:#fff;--t:#1f2421;--m:#6b7069;--r:#b8321f;--o:#f26a1b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px -apple-system,system-ui,sans-serif;touch-action:manipulation}
input,select,textarea,button{font-size:16px;font-family:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid #d6d3cb;border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font-weight:600}
button.s{background:#e7e4dc;color:var(--t)}button.d{background:none;color:var(--r);padding:6px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:16px 0 8px}
.sub{color:var(--m);font-size:13px}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.card{background:var(--c);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0001}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.n{flex:0 0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e2da;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--m);padding:8px 0 6px;font-size:12px;font-weight:500;position:relative}
nav button b{display:block;font-size:22px}nav button.on{color:var(--teal)}
.badge{position:absolute;top:2px;right:22%;background:var(--r);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--g);background:#fff;flex:0 0 28px;padding:0}
.chk.on{background:var(--g)}.done .tt{text-decoration:line-through;color:var(--m)}
.pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:12px;background:#eee;margin-right:4px}
.hi{background:#fde2e0;color:var(--r)}.md{background:#fdf0d9;color:var(--o)}.lo{background:#e1eef8;color:var(--teal)}
.seg{display:flex;background:#e7e4dc;border-radius:10px;padding:3px;margin:8px 0}.seg button{flex:1;background:none;color:var(--t);padding:7px}.seg button.on{background:#fff}
.bar{height:10px;border-radius:5px;background:#eee;overflow:hidden;display:flex}.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid #eee}
img.ph{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
.sheet{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet label{display:block;margin:10px 0 4px;font-size:14px;color:var(--m)}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;color:var(--g);z-index:30;pointer-events:none;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.conf{position:fixed;top:-10px;width:8px;height:12px;z-index:29;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.big{font-size:30px;font-weight:800}.center{text-align:center}
#login{padding:14vh 24px;text-align:center}
</style></head><body>
<div id="login" hidden><img src="logo.png" alt="Arpero Family" style="width:220px"><p class="sub">Est. 2023 · Our home, our team</p><button id="gbtn">Sign in with Google</button><p id="lmsg" class="sub"></p></div>
<div id="app" hidden>
<header><img src="icon-180.png" alt="" style="width:40px;height:40px;border-radius:10px;margin-right:10px"><div style="flex:1"><h1 id="ttl">To-dos</h1><div class="sub" id="who"></div></div><button class="s n" id="addBtn">＋ Add</button></header>
<main id="main"></main>
<nav id="nav"></nav></div>
<div id="sheet"></div>
<script src="parse.js"></script>
<script type="module">
const V='https://www.gstatic.com/firebasejs/11.10.0/';
const [{initializeApp},A,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
const fb=initializeApp({apiKey:"AIzaSyCBmD2yN0DkDWkGBR9RDS4ApqVs13pSGC4",authDomain:"arpero-shop.firebaseapp.com",projectId:"arpero-shop",storageBucket:"arpero-shop.firebasestorage.app",messagingSenderId:"404661227591"},'family');
const auth=A.getAuth(fb);await A.setPersistence(auth,A.browserLocalPersistence);
const db=F.initializeFirestore(fb,{localCache:F.persistentLocalCache()});
const OSCAR='oskararpero@gmail.com';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Math.random().toString(36).slice(2,10);
const col=n=>F.collection(db,'families','arpero',n),dref=(n,id)=>F.doc(db,'families','arpero',n,id);
const S={todos:[],items:[],logs:[],fixes:[],meta:{names:{oscar:'Oscar',wife:'Wife'}},tab:'home',sub:null,pantrySeg:'stock',meals:[],chores:[],rewards:[],maint:[],ideas:[],dates:[],shop:[],me:null,cmp:'week',seenFix:+localStorage.seenFix||0};
const who=e=>e===OSCAR?'oscar':'wife',nm=k=>S.meta.names?.[k]||({oscar:'Oscar',wife:'Wife'})[k]||k;
const save=(n,o)=>F.setDoc(dref(n,o.id),o,{merge:true}),del=(n,id)=>F.deleteDoc(dref(n,id));
const prov=()=>{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p};
$('#gbtn').onclick=async()=>{try{await A.signInWithPopup(auth,prov())}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))return A.signInWithRedirect(auth,prov());$('#lmsg').textContent=e.message}};
let unsubs=[];
A.onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];
 if(!u){$('#login').hidden=false;$('#app').hidden=true;return}
 S.me=who(u.email);$('#login').hidden=true;$('#app').hidden=false;
 for(const n of ['todos','items','logs','fixes','meals','chores','rewards','maint','ideas','dates','shop'])unsubs.push(F.onSnapshot(col(n),s=>{S[n]=s.docs.map(d=>d.data());if(n==='fixes')notifyFix();R()},err=>denied(err)));
 unsubs.push(F.onSnapshot(dref('meta','settings'),s=>{if(s.exists())S.meta=s.data();R()},()=>{}));
});
function denied(e){$('#app').hidden=true;$('#login').hidden=false;$('#lmsg').innerHTML='This account ('+esc(auth.currentUser?.email)+') is not on the family list.<br><a href="#" id="so">Sign out</a>';$('#so').onclick=()=>A.signOut(auth)}
// ---------- points ----------
const P={cook:5,maint:5,todo:10,used:2,beforeExp:3,bought:1,scan:5,fixReq:2,fix:25};
function events(){const ev=[];
 S.todos.forEach(t=>t.done&&t.doneBy&&ev.push({who:t.doneBy,pts:P.todo,at:t.doneAt,k:'todo'}));
 S.logs.forEach(l=>{if(l.type==='used'){ev.push({who:l.by,pts:P.used+(l.beforeExp?P.beforeExp:0),at:l.at,k:l.beforeExp?'saved':'used'})}
  else if(l.type==='bought')ev.push({who:l.by,pts:P.bought,at:l.at,k:'bought'});
  else if(l.type==='scan')ev.push({who:l.by,pts:P.scan,at:l.at,k:'scan'});
  else if(l.pts&&l.type!=='redeem')ev.push({who:l.by,pts:l.pts,at:l.at,k:l.type})});
 S.fixes.forEach(f=>{ev.push({who:f.by,pts:P.fixReq,at:f.at,k:'fixreq'});if(f.status==='fixed')ev.push({who:f.fixedBy||'oscar',pts:P.fix,at:f.fixedAt,k:'fix'})});
 return ev.filter(e=>e.who&&e.at)}
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x};
function stats(k){const ev=events().filter(e=>e.who===k),tot=ev.reduce((a,e)=>a+e.pts,0),ws=+weekStart(Date.now());
 const wk=ev.filter(e=>e.at>=ws).reduce((a,e)=>a+e.pts,0);
 const days=new Set(ev.map(e=>new Date(e.at).toLocaleDateString('en-CA')));let st=0,d=new Date();
 if(!days.has(d.toLocaleDateString('en-CA')))d.setDate(d.getDate()-1);
 while(days.has(d.toLocaleDateString('en-CA'))){st++;d.setDate(d.getDate()-1)}
 const lvl=Math.floor(Math.sqrt(tot/50))+1,cnt=x=>ev.filter(e=>e.k===x).length;
 const B=[['🌱','First points',tot>0],['✅','10 to-dos',cnt('todo')>=10],['🧾','Receipt scanner',cnt('scan')>=1],['🥕','Waste warrior (10 saves)',cnt('saved')>=10],
  ['🔧','Fixer (5 fixes)',cnt('fix')>=5],['🔥','7-day streak',st>=7],['🏆','Level 5',lvl>=5],['💯','500 points',tot>=500]];
 const spent=S.logs.filter(l=>l.type==='redeem'&&l.by===k).reduce((a,l)=>a+(+l.cost||0),0);
 return{tot,wk,st,lvl,next:50*lvl*lvl,B,bal:tot-spent}}
function celebrate(p){const e=document.createElement('div');e.className='pop';e.textContent=typeof p==='number'?'+'+p+' pts':p;document.body.append(e);setTimeout(()=>e.remove(),1200);
 for(let i=0;i<24;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#0f2d52','#f26a1b','#b8321f','#1f6fa8','#f7a325'][i%5];c.style.animationDelay=Math.random()*.3+'s';document.body.append(c);setTimeout(()=>c.remove(),2100)}
 navigator.vibrate?.(30)}
// ---------- fix notifications ----------
let firstFix=true;
function notifyFix(){const open=S.fixes.filter(f=>f.status!=='fixed');
 navigator.setAppBadge?.(S.me==='oscar'?open.length:0).catch?.(()=>{});
 if(!firstFix&&S.me==='oscar'){const nw=S.fixes.filter(f=>f.at>S.seenFix&&f.by!=='oscar');if(nw.length&&'Notification'in window&&Notification.permission==='granted')new Notification('New Fix It request',{body:nw[0].note||'Something needs fixing',icon:'icon-180.png'})}
 firstFix=false}
// ---------- render ----------
const TABS=[['home','🏠','Home'],['todos','☑️','To-dos'],['pantry','🥫','Groceries'],['fix','🔧','Fix It'],['more','☰','More']];
function R(){
 const openFix=S.fixes.filter(f=>f.status!=='fixed'&&(S.me!=='oscar'||f.at>S.seenFix||f.status==='open')).length;
 $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-t="${k}"><b>${i}</b>${l}${k==='fix'&&openFix?`<span class="badge">${openFix}</span>`:''}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.sub=null;if(S.tab==='fix'){S.seenFix=Date.now();localStorage.seenFix=S.seenFix}R();scrollTo(0,0)});
 $('#ttl').textContent=S.sub?SUBS.find(x=>x[0]===S.sub)[2]:TABS.find(t=>t[0]===S.tab)[2];
 const st=stats(S.me);$('#who').textContent=`${nm(S.me)} · Lv ${st.lvl} · ${st.tot} pts · 🔥${st.st}`;
 $('#addBtn').hidden=!['todos','pantry','fix'].includes(S.tab);
 $('#main').innerHTML=S.sub?(S.sub!=='more'?'<button class="s" data-sub="" style="margin:4px 0">‹ More</button>':'')+VIEWS[S.sub]():({home:vHome,todos:vTodos,pantry:vPantry,fix:vFix,more:vMore})[S.tab]();
 bind()}
const dueTxt=d=>{if(!d)return'';const t=today();return d<t?`<span class="pill hi">Overdue ${d.slice(5)}</span>`:d===t?'<span class="pill md">Today</span>':`<span class="pill">${d.slice(5)}</span>`};
let todoFilter='all';
function vTodos(){let L=S.todos.slice();if(todoFilter==='mine')L=L.filter(t=>t.who===S.me||t.who==='both');
 L.sort((a,b)=>(a.done-b.done)||((a.due||'9')>(b.due||'9')?1:-1));
 return `<div class="seg">${[['all','All'],['mine','Mine']].map(([k,l])=>`<button data-tf="${k}" class="${todoFilter===k?'on':''}">${l}</button>`).join('')}</div>`+
 (L.map(t=>`<div class="card row ${t.done?'done':''}"><button class="chk n ${t.done?'on':''}" data-done="${t.id}"></button><div data-edit="${t.id}"><div class="tt">${t.fixId?'🔧 ':''}${esc(t.title)}</div><div class="sub">${t.who==='both'?'Both':nm(t.who)} ${dueTxt(t.due)}${t.done?' · done by '+nm(t.doneBy):''}</div></div></div>`).join('')||'<p class="sub">No to-dos yet. Tap ＋ Add.</p>')}
function itemStock(i){return+(i.qty||0)}
function vPantry(){if(S.pantrySeg==='shop')return segP()+vShop();const L=S.items.slice().sort((a,b)=>a.name.localeCompare(b.name));
 return segP()+`<button class="s" id="scanBtn" style="width:100%;margin-top:6px">📷 Scan a receipt</button>`+
 (L.map(i=>{const low=i.min&&itemStock(i)<=i.min,exp=i.exp&&i.exp<=today();
  return `<div class="card"><div class="row"><div data-item="${i.id}"><b>${esc(i.name)}</b><div class="sub">${+itemStock(i).toFixed(2)} ${esc(i.unit)} ${low?'<span class="pill hi">Low</span>':''}${i.exp?`<span class="pill ${exp?'hi':''}">exp ${i.exp.slice(5)}</span>`:''}</div></div>
  <button class="s n" data-use="${i.id}">Used</button><button class="s n" data-buy="${i.id}">Bought</button></div></div>`}).join('')||'<p class="sub">Pantry is empty. Scan a receipt or tap ＋ Add.</p>')}
function vFix(){const L=S.fixes.slice().sort((a,b)=>(a.status==='fixed')-(b.status==='fixed')||b.at-a.at);
 const pr={high:'hi',med:'md',low:'lo'};
 return (S.me==='oscar'&&'Notification'in window&&Notification.permission==='default'?'<button class="s" id="notif" style="width:100%">🔔 Alert me on new requests</button>':'')+
 (L.map(f=>`<div class="card"><div class="row"><div><b>${esc(f.note||'Fix request')}</b><div class="sub"><span class="pill ${pr[f.pri]}">${f.pri}</span><span class="pill">${f.status==='open'?'Open':f.status==='prog'?'In progress':'✅ Fixed'}</span> from ${nm(f.by)} · ${new Date(f.at).toLocaleDateString()}</div></div></div>
 ${f.photo?`<img class="ph" src="${f.photo}">`:''}${f.after?`<div class="sub" style="margin-top:6px">After:</div><img class="ph" src="${f.after}">`:''}
 <div class="row" style="margin-top:8px">${f.status==='open'?`<button class="s" data-fs="${f.id}" data-v="prog">Start</button>`:''}${f.status!=='fixed'?`<button data-fixed="${f.id}">Mark fixed</button>`:''}<button class="d n" data-fdel="${f.id}">🗑</button></div></div>`).join('')||'<p class="sub">Nothing broken. 🎉 Tap ＋ Add to report something.</p>')}
function vStats(){const now=new Date(),start=S.cmp==='week'?weekStart(now):new Date(now.getFullYear(),now.getMonth(),1);
 const L=S.logs.filter(l=>l.at>=+start&&l.item),agg={};
 L.forEach(l=>{const a=agg[l.item]||(agg[l.item]={b:0,u:0,w:0,$:0});if(l.type==='bought'){a.b+=+l.qty||0;a.$+=+l.price||0}else if(l.type==='used')a.u+=+l.qty||0;else if(l.type==='wasted')a.w+=+l.qty||0});
 const rows=Object.entries(agg).map(([id,a])=>({i:S.items.find(x=>x.id===id),...a})).filter(r=>r.i).sort((x,y)=>y.$-x.$);
 const sum=k=>rows.reduce((s,r)=>s+r[k],0),spent=sum('$'),wasted$=rows.reduce((s,r)=>s+(r.b?r.$/r.b*r.w:0),0);
 return `<div class="seg">${[['week','This week'],['month','This month']].map(([k,l])=>`<button data-cmp="${k}" class="${S.cmp===k?'on':''}">${l}</button>`).join('')}</div>
 <div class="card row center"><div><div class="big">$${spent.toFixed(0)}</div><div class="sub">spent</div></div><div><div class="big">${rows.length}</div><div class="sub">items</div></div><div><div class="big" style="color:var(--r)">$${wasted$.toFixed(0)}</div><div class="sub">wasted (est.)</div></div></div>
 ${rows.map(r=>{const m=Math.max(r.b,r.u+r.w,0.001);return`<div class="card"><div class="row"><b>${esc(r.i.name)}</b><span class="sub n">${r.$?'$'+r.$.toFixed(2):''}</span></div>
 <div class="sub">Bought ${+r.b.toFixed(2)} · Used ${+r.u.toFixed(2)} · Wasted ${+r.w.toFixed(2)} ${esc(r.i.unit)}</div>
 <div class="bar" style="margin-top:6px"><i style="width:${r.u/m*100}%;background:var(--g)"></i><i style="width:${r.w/m*100}%;background:var(--r)"></i><i style="width:${Math.max(0,r.b-r.u-r.w)/m*100}%;background:#cfd8d3"></i></div></div>`}).join('')||'<p class="sub">No purchases or usage logged in this period yet.</p>'}
 <p class="sub">🟩 used · 🟥 wasted/expired · ⬜ still left</p>`}
function vGame(){const o=stats('oscar'),w=stats('wife'),lead=o.wk===w.wk?'Tied this week!':(o.wk>w.wk?nm('oscar'):nm('wife'))+' leads this week';
 const card=(k,s)=>`<div class="card"><div class="row"><b>${esc(nm(k))}</b><span class="n pill lo">Lv ${s.lvl}</span></div>
 <div class="row center" style="margin:8px 0"><div><div class="big">${s.wk}</div><div class="sub">this week</div></div><div><div class="big">${s.tot}</div><div class="sub">total</div></div><div><div class="big">🔥${s.st}</div><div class="sub">day streak</div></div></div>
 <div class="bar"><i style="width:${Math.min(100,s.tot/s.next*100)}%;background:var(--o)"></i></div><div class="sub">${s.next-s.tot} pts to level ${s.lvl+1}</div>
 <div style="margin-top:8px">${s.B.map(([i,l,on])=>`<span class="pill" style="opacity:${on?1:.3}" title="${l}">${i} ${l}</span>`).join(' ')}</div></div>`;
 return `<div class="card center"><div class="sub">Weekly scoreboard</div><div class="big">${o.wk} – ${w.wk}</div><div>${esc(lead)} 🏆</div></div>${card('oscar',o)}${card('wife',w)}
 <div class="card sub">Points: to-do ${P.todo} · fix ${P.fix} · fix request ${P.fixReq} · log usage ${P.used} (+${P.beforeExp} if used before it expires) · log purchase ${P.bought} · receipt scan ${P.scan}. Week resets Sunday.</div>
 <div class="card"><label class="sub">Names</label><div class="row"><input id="n1" value="${esc(nm('oscar'))}"><input id="n2" value="${esc(nm('wife'))}"><button class="n" id="saveN">Save</button></div>
 <p class="sub">Signed in as ${esc(auth.currentUser?.email)} · <a href="#" id="so2">Sign out</a></p></div>`}
// ---------- sheets ----------
function sheet(html,onSave){$('#sheet').innerHTML=`<div class="sheet"><div>${html}<div class="row" style="margin-top:14px"><button class="s" id="shX">Cancel</button>${onSave?'<button id="shOk">Save</button>':''}</div></div></div>`;
 $('#shX').onclick=close;$('.sheet').onclick=e=>{if(e.target.classList.contains('sheet'))close()};if(onSave)$('#shOk').onclick=async()=>{if(await onSave()!==false)close()}}
const close=()=>$('#sheet').innerHTML='',val=id=>$('#'+id).value.trim();
const whoSel=v=>`<select id="fw">${['oscar','wife','both'].map(k=>`<option value="${k}" ${v===k?'selected':''}>${k==='both'?'Both':esc(nm(k))}</option>`).join('')}</select>`;
function editTodo(t={}){sheet(`<h2>${t.id?'Edit':'New'} to-do</h2><label>What</label><input id="ft" value="${esc(t.title)}"><label>Who</label>${whoSel(t.who||S.me)}<label>Due</label><input id="fd" type="date" value="${t.due||''}">${t.id?`<button class="d" id="tdel">Delete</button>`:''}`,
 ()=>{if(!val('ft'))return false;save('todos',{id:t.id||uid(),title:val('ft'),who:$('#fw').value,due:$('#fd').value,done:t.done||false,at:t.at||Date.now()})});
 if(t.id)$('#tdel').onclick=()=>{del('todos',t.id);close()}}
function editItem(i={}){sheet(`<h2>${i.id?'Edit':'New'} item</h2><label>Name</label><input id="fn" value="${esc(i.name)}"><div class="row"><div><label>In stock</label><input id="fq" type="number" inputmode="decimal" value="${i.qty??''}"></div><div><label>Unit</label><input id="fu" value="${esc(i.unit||'ea')}"></div></div>
 <label>Category</label><select id="fc">${CATS.map(c=>`<option ${(i.cat||guessCat(i.name||''))===c?'selected':''}>${c}</option>`).join('')}</select><div class="row"><div><label>Add to shopping list when at or below</label><input id="fm" type="number" inputmode="decimal" value="${i.min??''}"></div><div><label>Expires</label><input id="fe" type="date" value="${i.exp||''}"></div></div>
 ${i.id?`<button class="s" id="wst" style="margin-top:10px">🗑 Log wasted / expired</button> <button class="d" id="idel">Delete item</button>`:''}`,

function editMeal(m={}){sheet(`<h2>${m.id?'Edit':'New'} meal</h2><label>Name</label><input id="mn" value="${esc(m.name)}" placeholder="Chicken tacos"><label>Ingredients (comma separated)</label><textarea id="mi" rows="3" placeholder="chicken, tortillas, avocado">${esc((m.ings||[]).join(', '))}</textarea>${m.id?'<button class="d" id="mdel">Delete</button>':''}`,
 ()=>{if(!val('mn'))return false;save('meals',{id:m.id||uid(),name:val('mn'),ings:val('mi').split(',').map(x=>x.trim()).filter(Boolean)})});if(m.id)$('#mdel').onclick=()=>{del('meals',m.id);close()}}
function vChores(){const t=today();return `<p class="sub">Chores repeat and take turns between you two. Done = points.</p>`+S.chores.slice().sort((a,b)=>a.next>b.next?1:-1).map(c=>`<div class="card row"><div data-chore="${c.id}"><b>${esc(c.name)}</b><div class="sub">${esc(nm(c.turn))}'s turn · every ${c.every} days · ${c.pts} pts ${c.next<=t?'<span class="pill hi">Due</span>':`<span class="pill">${c.next.slice(5)}</span>`}</div></div><button class="n" data-chdone="${c.id}">Done</button></div>`).join('')+`<button class="s" id="newChore" style="width:100%">＋ New chore</button>`}
function editChore(c={}){sheet(`<h2>${c.id?'Edit':'New'} chore</h2><label>Chore</label><input id="cn" value="${esc(c.name)}" placeholder="Take out trash"><div class="row"><div><label>Every (days)</label><input id="ce" type="number" inputmode="numeric" value="${c.every||7}"></div><div><label>Points</label><input id="cp" type="number" inputmode="numeric" value="${c.pts||10}"></div></div><label>Whose turn first</label>${whoSel(c.turn||S.me).replace('<option value="both"','<option disabled value="both"')}${c.id?'<button class="d" id="cdel">Delete</button>':''}`,
 ()=>{if(!val('cn'))return false;save('chores',{id:c.id||uid(),name:val('cn'),every:+val('ce')||7,pts:+val('cp')||10,turn:$('#fw').value==='both'?'oscar':$('#fw').value,next:c.next||today()})});if(c.id)$('#cdel').onclick=()=>{del('chores',c.id);close()}}
function vRewards(){const st=stats(S.me);return `<div class="card center"><div class="sub">Your points to spend</div><div class="big">${st.bal}</div></div><p class="sub">Make up prizes together (back rub, pick the movie, sleep in…). Redeem with points.</p>`+
 S.rewards.map(r=>`<div class="card row"><div><b>${esc(r.name)}</b><div class="sub">${r.cost} pts</div></div><button class="n" data-redeem="${r.id}" ${st.bal<r.cost?'disabled style="opacity:.4"':''}>Redeem</button><button class="d n" data-rdel="${r.id}">✕</button></div>`).join('')+`<button class="s" id="newReward" style="width:100%">＋ New prize</button>
 <h2>Recently redeemed</h2>${S.logs.filter(l=>l.type==='redeem').sort((a,b)=>b.at-a.at).slice(0,8).map(l=>`<div class="sub">🎁 ${esc(nm(l.by))}: ${esc(l.name)} (−${l.cost}) · ${new Date(l.at).toLocaleDateString()}</div>`).join('')||'<p class="sub">None yet.</p>'}`}
const MDEF=[['Replace AC filter',90],['Flush water heater',365],['Test smoke detectors',30],['Replace smoke detector batteries',365],['Check Powerwall & solar in Tesla app',30],['Inspect EV charger & cable',90],['Clean dryer vent',365],['Clean fridge coils',180]];
function vMaint(){const L=maintDue();return (L.length?'':`<div class="card"><p>Start with the usual list? (AC filter, water heater, smoke detectors, Powerwall/solar, EV charger…)</p><button id="seedM">Add the usual list</button></div>`)+
 L.map(m=>{const d=daysTo(m.due);return`<div class="card row"><div data-mt="${m.id}"><b>${esc(m.name)}</b><div class="sub">every ${m.every} days · ${m.last?'last '+m.last.slice(5):'never logged'} ${d<=0?'<span class="pill hi">Due</span>':d<=7?`<span class="pill md">in ${d}d</span>`:`<span class="pill">in ${d}d</span>`}</div></div><button class="n" data-mdone="${m.id}">Done</button></div>`}).join('')+`<button class="s" id="newMaint" style="width:100%">＋ New reminder</button>`}
function editMaint(m={}){sheet(`<h2>${m.id?'Edit':'New'} home care reminder</h2><label>Task</label><input id="xn" value="${esc(m.name)}"><div class="row"><div><label>Every (days)</label><input id="xe" type="number" inputmode="numeric" value="${m.every||90}"></div><div><label>Last done</label><input id="xl" type="date" value="${m.last||''}"></div></div>${m.id?'<button class="d" id="xdel">Delete</button>':''}`,
 ()=>{if(!val('xn'))return false;save('maint',{id:m.id||uid(),name:val('xn'),every:+val('xe')||90,last:$('#xl').value})});if(m.id)$('#xdel').onclick=()=>{del('maint',m.id);close()}}
function vDates(){const nd=nextDates(),ideas=S.ideas.filter(i=>!i.done);
 return `<h2>💑 Date night jar</h2><button id="pickIdea" style="width:100%;padding:16px;font-size:18px">🎲 Pick a date for us</button><div id="pick" class="center big" style="font-size:22px;min-height:34px;margin:10px 0"></div>
 ${ideas.map(i=>`<div class="card row"><div>${esc(i.text)}</div><button class="s n" data-idone="${i.id}">Did it ✓</button><button class="d n" data-idel="${i.id}">✕</button></div>`).join('')}<button class="s" id="newIdea" style="width:100%">＋ Add a date idea</button>
 <h2>📅 Important dates</h2>${S.dates.some(d=>/anniv/i.test(d.name))?'':`<div class="card"><p>Add your anniversary (married 2023)?</p><button id="addAnniv">Add anniversary</button></div>`}
 ${nd.map(d=>`<div class="card row" data-dt="${d.id}"><div><b>${esc(d.name)}</b><div class="sub">${new Date(d.next+'T12:00').toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}${d.yrs>0&&/anniv/i.test(d.name)?' · '+d.yrs+' years 💍':''}</div></div><div class="n center"><div class="big" style="font-size:24px">${d.days}</div><div class="sub">days</div></div></div>`).join('')}<button class="s" id="newDate" style="width:100%">＋ Add a date (birthday, bill, anniversary)</button>`}
function editDate(d={}){sheet(`<h2>${d.id?'Edit':'New'} date</h2><label>Name</label><input id="dn" value="${esc(d.name)}" placeholder="Wife's birthday"><label>Date</label><input id="dd" type="date" value="${d.date||''}"><label>Repeats</label><select id="dy"><option value="1" ${d.yearly!==false?'selected':''}>Every year</option><option value="0" ${d.yearly===false?'selected':''}>One time</option></select>${d.id?'<button class="d" id="ddel">Delete</button>':''}`,
 ()=>{if(!val('dn')||!$('#dd').value)return false;save('dates',{id:d.id||uid(),name:val('dn'),date:$('#dd').value,yearly:$('#dy').value==='1'})});if(d.id)$('#ddel').onclick=()=>{del('dates',d.id);close()}}
const VIEWS={budget:vBudget,compare:()=>vStats(),meals:vMeals,chores:vChores,rewards:vRewards,maint:vMaint,dates:vDates,score:()=>vGame()};
const plog=(type,pts,extra={})=>save('logs',{id:uid(),type,pts,by:S.me,at:Date.now(),...extra});
function bindExtra(on){
 on('[data-sub]',e=>{S.tab='more';S.sub=e.dataset.sub||null;R();scrollTo(0,0)});
 on('[data-go]',e=>{const g=e.dataset.go;if(g==='t:shop'){S.tab='pantry';S.pantrySeg='shop';S.sub=null}else if(g.startsWith('t:')){S.tab=g.slice(2);S.sub=null}else{S.tab='more';S.sub=g}R();scrollTo(0,0)});
 on('[data-q]',e=>({scan,fix:newFix,todo:()=>editTodo(),use:quickUse})[e.dataset.q]());
 on('#hintX',()=>{localStorage.hintDone=1;R()});
 on('[data-pseg]',e=>{S.pantrySeg=e.dataset.pseg;R()});
 on('[data-lowbuy]',e=>{const i=S.items.find(x=>x.id===e.dataset.lowbuy);shopBought(i.name)});
 on('[data-shopdone]',e=>{const x=S.shop.find(y=>y.id===e.dataset.shopdone);shopBought(x.name,()=>del('shop',x.id))});
 on('[data-shopdel]',e=>del('shop',e.dataset.shopdel));
 on('#setB',()=>sheet(`<h2>Monthly grocery budget</h2><input id="bb" type="number" inputmode="decimal" value="${S.meta.budget||''}" placeholder="800">`,()=>F.setDoc(dref('meta','settings'),{budget:+val('bb')||0},{merge:true})));
 m_on();function m_on(){$('#main').querySelectorAll('[data-plan]').forEach(s=>s.onchange=()=>F.setDoc(dref('meta','settings'),{plan:{[s.dataset.plan]:s.value}},{merge:true}))}
 on('[data-cook]',async e=>{const m=S.meals.find(x=>x.id===e.dataset.cook);for(const g of m.ings||[]){const i=has(g);if(i)await logQty(i,'used',1)}await plog('cook',P.cook,{name:m.name});celebrate(P.cook)});
 on('[data-miss]',async e=>{const m=S.meals.find(x=>x.id===e.dataset.miss);for(const g of mealScore(m).miss)if(!S.shop.some(x=>!x.done&&x.name.toLowerCase()===g.toLowerCase()))await save('shop',{id:uid(),name:g,note:'for '+m.name,by:S.me,at:Date.now(),done:false});alert('Added to the shopping list')});
 on('[data-meal]',e=>editMeal(S.meals.find(x=>x.id===e.dataset.meal)));on('#newMeal',()=>editMeal());
 on('[data-chore]',e=>editChore(S.chores.find(x=>x.id===e.dataset.chore)));on('#newChore',()=>editChore());
 on('[data-chdone]',async e=>{const c=S.chores.find(x=>x.id===e.dataset.chdone);await save('chores',{...c,next:addDays(today(),c.every),turn:c.turn==='oscar'?'wife':'oscar'});await plog('chore',c.pts,{name:c.name});celebrate(c.pts)});
 on('#newReward',()=>sheet(`<h2>New prize</h2><label>Prize</label><input id="rn" placeholder="Pick the movie"><label>Cost (points)</label><input id="rc" type="number" inputmode="numeric" value="100">`,()=>{if(!val('rn'))return false;save('rewards',{id:uid(),name:val('rn'),cost:+val('rc')||100})}));
 on('[data-redeem]',async e=>{const r=S.rewards.find(x=>x.id===e.dataset.redeem);if(stats(S.me).bal<r.cost||!confirm(`Redeem "${r.name}" for ${r.cost} points?`))return;await plog('redeem',0,{name:r.name,cost:r.cost});celebrate('🎁')});
 on('[data-rdel]',e=>del('rewards',e.dataset.rdel));
 on('#seedM',async()=>{for(const [n,d] of MDEF)await save('maint',{id:uid(),name:n,every:d,last:''})});
 on('[data-mt]',e=>editMaint(S.maint.find(x=>x.id===e.dataset.mt)));on('#newMaint',()=>editMaint());
 on('[data-mdone]',async e=>{const m=S.maint.find(x=>x.id===e.dataset.mdone);await save('maint',{...m,last:today()});await plog('maint',P.maint,{name:m.name});celebrate(P.maint)});
 on('#newIdea',()=>sheet(`<h2>Date idea</h2><input id="in" placeholder="Picnic at Cypress Creek park">`,()=>{if(!val('in'))return false;save('ideas',{id:uid(),text:val('in'),done:false})}));
 on('[data-idone]',e=>save('ideas',{...S.ideas.find(x=>x.id===e.dataset.idone),done:true}));on('[data-idel]',e=>del('ideas',e.dataset.idel));
 on('#pickIdea',()=>{const L=S.ideas.filter(i=>!i.done);if(!L.length){$('#pick').textContent='Add some ideas first 💡';return}let n=0;const t=setInterval(()=>{if(!$('#pick'))return clearInterval(t);$('#pick').textContent=L[Math.floor(Math.random()*L.length)].text;if(++n>12){clearInterval(t);celebrate('💑')}},90)});
 on('#addAnniv',()=>editDate({name:'Our anniversary',yearly:true}));
 on('[data-dt]',e=>editDate(S.dates.find(x=>x.id===e.dataset.dt)));on('#newDate',()=>editDate());
}

document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
