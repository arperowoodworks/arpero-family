<script type="module">

const fb=initializeApp({apiKey:"AIzaSyCBmD2yN0DkDWkGBR9RDS4ApqVs13pSGC4",authDomain:"arpero-shop.firebaseapp.com",projectId:"arpero-shop",storageBucket:"arpero-shop.firebasestorage.app",messagingSenderId:"404661227591"},'family');
const auth=A.getAuth(fb);await A.setPersistence(auth,A.browserLocalPersistence);

const OSCAR='oskararpero@gmail.com';

const today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Math.random().toString(36).slice(2,10);
const col=n=>F.collection(db,'families','arpero',n),dref=(n,id)=>F.doc(db,'families','arpero',n,id);
const S={todos:[],items:[],logs:[],fixes:[],meta:{names:{oscar:'Oscar',wife:'Kerissa'}},tab:'home',sub:null,pantrySeg:'stock',meals:[],chores:[],rewards:[],maint:[],ideas:[],dates:[],shop:[],shouts:[],me:null,cmp:'week',grocmem:{},gstore:localStorage.gstore||'all',seenFix:+localStorage.seenFix||0};
{const g=new URLSearchParams(location.search).get('go');if(g==='fix')S.tab='fix';else if(g)S.tab='home'}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.go){S.tab=e.data.go==='fix'?'fix':'home';S.sub=null;typeof R==='function'&&R();scrollTo(0,0)}});
const who=e=>(e||'').toLowerCase()===OSCAR?'oscar':'wife',nm=k=>{const v=S.meta.names?.[k];return (v&&v!=='Wife'?v:0)||({oscar:'Oscar',wife:'Kerissa'})[k]||k};
const save=(n,o)=>F.setDoc(dref(n,o.id),o,{merge:true}),del=(n,id)=>F.deleteDoc(dref(n,id));
const prov=()=>{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p};
$('#gbtn').onclick=async()=>{try{await A.signInWithPopup(auth,prov())}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))return A.signInWithRedirect(auth,prov());$('#lmsg').textContent=e.message}};

// ---------- email sign-in (link + password fallback) ----------
const APPURL='https://arperowoodworks.github.io/arpero-family/';
const isPWA=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const msg=t=>$('#lmsg').innerHTML=t,em=()=>$('#lem').value.trim().toLowerCase();
const errTxt=e=>({'auth/invalid-email':'That email doesn\'t look right.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account yet. Tap "Create account".','auth/email-already-in-use':'You already have an account. Tap "Sign in", or use the email link.','auth/weak-password':'Use at least 6 characters.','auth/operation-not-allowed':'This sign-in option isn\'t turned on yet.','auth/too-many-requests':'Too many tries. Wait a minute and try again.','auth/invalid-action-code':'This link was already used or expired. Request a new one.'})[e.code]||e.message;
let pwMode=false;const setPw=v=>{pwMode=v;$('#lpwbox').hidden=!v;$('#lpwbtns').hidden=!v;$('#lsend').hidden=v;$('#lpwmode').textContent=v?'Email me a link instead':'Use a password instead';msg('')};
$('#ebtn').onclick=()=>{$('#lmain').hidden=true;$('#lemail').hidden=false;$('#lem').value=localStorage.emailForSignIn||'';msg('');$('#lem').focus()};
$('#lback').onclick=e=>{e.preventDefault();$('#lmain').hidden=false;$('#lemail').hidden=true;setPw(false)};
$('#lpwmode').onclick=e=>{e.preventDefault();setPw(!pwMode)};
$('#lsend').onclick=async()=>{const e=em();if(!e)return msg('Type your email first.');try{await A.sendSignInLinkToEmail(auth,e,{url:APPURL,handleCodeInApp:true});localStorage.emailForSignIn=e;msg('📬 Check your email ('+esc(e)+') and tap the sign-in link.'+(isPWA?'<br>It will open in Safari. After that, come back to this app and use "Use a password instead" if you\'re not signed in here.':''))}catch(x){msg(errTxt(x))}};
$('#lpin').onclick=async()=>{try{await A.signInWithEmailAndPassword(auth,em(),$('#lpw').value)}catch(x){msg(errTxt(x))}};
$('#lpup').onclick=async()=>{try{const c=await A.createUserWithEmailAndPassword(auth,em(),$('#lpw').value);if(!c.user.emailVerified){await A.sendEmailVerification(c.user,{url:APPURL});msg('Account created! We sent a quick confirmation email. Tap the link in it, then come back and sign in.');await A.signOut(auth)}}catch(x){msg(errTxt(x))}};
$('#lforgot').onclick=async e=>{e.preventDefault();const a=em();if(!a)return msg('Type your email first, then tap "Forgot password?".');try{await A.sendPasswordResetEmail(auth,a,{url:APPURL});msg('📬 Password reset email sent to '+esc(a)+'.')}catch(x){msg(errTxt(x))}};
let linkNote=false;
if(A.isSignInWithEmailLink(auth,location.href)){let e=localStorage.emailForSignIn;if(!e)e=(prompt('Please confirm your email to finish signing in')||'').trim().toLowerCase();
 if(e){try{await A.signInWithEmailLink(auth,e,location.href);localStorage.removeItem('emailForSignIn');linkNote=!isPWA}catch(x){msg(errTxt(x))}}
 history.replaceState(null,'',location.pathname)}
function afterLinkSheet(){if(!linkNote)return;linkNote=false;const u=auth.currentUser;
 sheet(`<h2>You're signed in! 🎉</h2><p>Next time, just tap the <b>Arpero Family</b> icon on your home screen.</p><p class="sub">If the home-screen app asks you to sign in again, create a password below, then in the app tap <b>Sign in with email → Use a password instead</b>.</p><label>New password (optional)</label><input id="npw" type="password" autocomplete="new-password" placeholder="At least 6 characters"><button id="npwb" style="width:100%;margin-top:10px">Save password</button><p id="npwm" class="sub"></p>`);
  $('#npwb').onclick=async()=>{try{await A.updatePassword(u,$('#npw').value);$('#npwm').textContent='✅ Password saved. Use it in the home-screen app.'}catch(x){$('#npwm').textContent=errTxt(x)}}}
let unsubs=[],calApi=null;const calEl=document.createElement('div');
A.onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];
 if(!u){$('#login').hidden=false;$('#app').hidden=true;return}
 retried=0;S.me=who(u.email);$('#login').hidden=true;$('#app').hidden=false;setTimeout(afterLinkSheet,300);startListeners(u)});
function startListeners(u){unsubs.forEach(f=>f());unsubs=[];if(!u)return;setTimeout(refreshSub,2500);
 if(!calApi){import('./cal.js?v=8').then(m=>{calApi=m.initCal({db,F,me:S.me,el:calEl,app:'family',names:{oscar:nm('oscar'),wife:nm('wife')}});if(S.tab==='cal')R()})}
 for(const n of ['todos','items','logs','fixes','meals','chores','rewards','maint','ideas','dates','shop','shouts'])unsubs.push(F.onSnapshot(col(n),s=>{S[n]=s.docs.map(d=>d.data());if(n==='fixes')notifyFix();R()},err=>denied(err)));
 unsubs.push(F.onSnapshot(dref('meta','grocmem'),s=>{S.grocmem=s.exists()?s.data():{};if(S.tab==='pantry')R()},()=>{}));
 unsubs.push(F.onSnapshot(dref('meta','settings'),s=>{if(s.exists())S.meta=s.data();R()},()=>{}));
}
let retried=0;function denied(e){console.error('Firestore listener error',e);const c=e&&e.code||'';
 if(c!=='permission-denied'||retried<2){if(!denied.t){denied.t=setTimeout(async()=>{denied.t=0;retried++;try{await auth.currentUser?.getIdToken(true)}catch(_){}startListeners(auth.currentUser)},1500*(retried+1))}if(c!=='permission-denied')return;if(retried<2)return}
 $('#app').hidden=true;$('#login').hidden=false;$('#lmsg').innerHTML='This account ('+esc(auth.currentUser?.email)+') is not on the family list.<br><small>('+esc(e&&e.code||'')+')</small><br><a href="#" id="rt">Try again</a> · <a href="#" id="so">Sign out</a>';$('#so').onclick=()=>A.signOut(auth);$('#rt').onclick=ev=>{ev.preventDefault();retried=0;$('#login').hidden=true;$('#app').hidden=false;auth.currentUser?.getIdToken(true).finally(()=>startListeners(auth.currentUser))}}
// ---------- points ----------
const P={cook:5,maint:5,todo:10,used:2,beforeExp:3,bought:1,scan:5,fixReq:2,fix:25};
function events(){const ev=[];
 S.todos.forEach(t=>t.done&&t.doneBy&&ev.push({who:t.doneBy,pts:P.todo,at:t.doneAt,k:'todo'}));
 S.logs.forEach(l=>{if(l.type==='used'){ev.push({who:l.by,pts:P.used+(l.beforeExp?P.beforeExp:0),at:l.at,k:l.beforeExp?'saved':'used'})}
  else if(l.type==='bought')ev.push({who:l.by,pts:P.bought,at:l.at,k:'bought'});
  else if(l.type==='scan')ev.push({who:l.by,pts:P.scan,at:l.at,k:'scan'});
  else if(l.pts&&l.type!=='redeem')ev.push({who:l.by,pts:l.pts,at:l.at,k:l.type})});
 S.fixes.forEach(f=>{ev.push({who:f.by,pts:P.fixReq,at:f.at,k:'fixreq'});if(f.status==='fixed')ev.push({who:f.fixedBy||'oscar',pts:P.fix,at:f.fixedAt,k:'fix'})});
 return ev.filter(e=>e.who&&e.at)}
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x};
function stats(k){const ev=events().filter(e=>!k||e.who===k),tot=ev.reduce((a,e)=>a+e.pts,0),ws=+weekStart(Date.now());
 const wk=ev.filter(e=>e.at>=ws).reduce((a,e)=>a+e.pts,0);
 const days=new Set(ev.map(e=>new Date(e.at).toLocaleDateString('en-CA')));let st=0,d=new Date();
 if(!days.has(d.toLocaleDateString('en-CA')))d.setDate(d.getDate()-1);

 const lvl=Math.floor(Math.sqrt(tot/50))+1,cnt=x=>ev.filter(e=>e.k===x).length;
 const B=[['🌱','First team points',tot>0],['✅','25 to-dos together',cnt('todo')>=25],['🧾','First receipt scanned',cnt('scan')>=1],['🥕','Saved 10 foods from waste',cnt('saved')>=10],
  ['🔧','5 fixes done',cnt('fix')>=5],['🧹','10 chores done',cnt('chore')>=10],['🍽️','Cooked 5 planned meals',cnt('cook')>=5],['🔥','7-day team streak',st>=7],['🏡','Team level 5',lvl>=5],['💯','1,000 team points',tot>=1000]];
 const spent=S.logs.filter(l=>l.type==='redeem').reduce((a,l)=>a+(+l.cost||0),0);
 return{tot,wk,st,lvl,next:50*lvl*lvl,B,bal:tot-spent}}

 navigator.vibrate?.(30)}
// ---------- fix notifications ----------

async function shrink(file,max=1000,q=.6){const img=await createImageBitmap(file);const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);let u=c.toDataURL('image/jpeg',q);if(u.length>700000)u=c.toDataURL('image/jpeg',.4);return u}

const VIEWS={fixit:()=>{setTimeout(()=>{S.tab='fix';S.sub=null;R()});return''},budget:vBudget,compare:()=>vStats(),meals:vMeals,chores:vChores,rewards:vRewards,maint:vMaint,dates:vDates,challenges:vChallenges,score:()=>vGame()};
const plog=(type,pts,extra={})=>save('logs',{id:uid(),type,pts,by:S.me,at:Date.now(),...extra});
function bindExtra(on){
 on('[data-sub]',e=>{S.tab='more';S.sub=e.dataset.sub||null;R();scrollTo(0,0)});
 on('[data-go]',e=>{const g=e.dataset.go;if(g==='t:shop'){S.tab='pantry';S.pantrySeg='shop';S.sub=null}else if(g.startsWith('t:')){S.tab=g.slice(2);S.sub=null}else{S.tab='more';S.sub=g}R();scrollTo(0,0)});
 on('[data-q]',e=>({scan,fix:newFix,todo:()=>editTodo(),use:quickUse})[e.dataset.q]());
 on('#hintX',()=>{localStorage.hintDone=1;R()});
 on('[data-pseg]',e=>{S.pantrySeg=e.dataset.pseg;R()});
 on('[data-lowbuy]',e=>{const i=S.items.find(x=>x.id===e.dataset.lowbuy);shopBought(i.name)});
 on('[data-shopdone]',e=>{const x=S.shop.find(y=>y.id===e.dataset.shopdone);shopBought(x.name,()=>del('shop',x.id))});
 on('[data-shopdel]',e=>del('shop',e.dataset.shopdel));
 on('[data-gfilter]',e=>{S.gstore=e.dataset.gfilter;localStorage.gstore=S.gstore;R()});on('#gAddBig',()=>addShop());
 on('[data-qty]',async e=>{const x=S.shop.find(y=>y.id===e.dataset.qty);const q=Math.max(0,(x.qty||1)+ +e.dataset.d);if(q===0){if(confirm('Remove '+x.name+'?'))await del('shop',x.id)}else await save('shop',{...x,qty:q})});
 on('[data-gstore]',async e=>{const id=e.dataset.gstore,n=e.dataset.name,cur=e.textContent.trim(),nx=GSTORES[(GSTORES.indexOf(cur)+1)%3];
  if(id[0]==='L'&&!S.shop.find(y=>y.id===id)){S.grocmem={...(S.grocmem||{}),[gkey(n).replace(/[.\/~*\[\]]/g,'_')]:{...gmem(n),name:n,store:nx}};R()}else{const x=S.shop.find(y=>y.id===id);if(x)await save('shop',{...x,store:nx})}
  remember(n,{store:nx,cat:gguess(n)})});
 on('#setB',()=>sheet(`<h2>Monthly grocery budget</h2><input id="bb" type="number" inputmode="decimal" value="${S.meta.budget||''}" placeholder="800">`,()=>F.setDoc(dref('meta','settings'),{budget:+val('bb')||0},{merge:true})));
 m_on();function m_on(){$('#main').querySelectorAll('[data-plan]').forEach(s=>s.onchange=()=>F.setDoc(dref('meta','settings'),{plan:{[s.dataset.plan]:s.value}},{merge:true}))}
 on('[data-cook]',async e=>{const m=S.meals.find(x=>x.id===e.dataset.cook);for(const g of m.ings||[]){const i=has(g);if(i)await logQty(i,'used',1)}await plog('cook',P.cook,{name:m.name});celebrate(P.cook)});
 on('[data-miss]',async e=>{const m=S.meals.find(x=>x.id===e.dataset.miss);for(const g of mealScore(m).miss)if(!S.shop.some(x=>!x.done&&x.name.toLowerCase()===g.toLowerCase()))await save('shop',{id:uid(),name:g,note:'for '+m.name,by:S.me,at:Date.now(),done:false});alert('Added to the shopping list')});
 on('[data-meal]',e=>editMeal(S.meals.find(x=>x.id===e.dataset.meal)));on('#newMeal',()=>editMeal());
 on('[data-chore]',e=>editChore(S.chores.find(x=>x.id===e.dataset.chore)));on('#newChore',()=>editChore());
 on('[data-chdone]',async e=>{const c=S.chores.find(x=>x.id===e.dataset.chdone);await save('chores',{...c,next:addDays(today(),c.every),turn:c.turn==='oscar'?'wife':'oscar'});await plog('chore',c.pts,{name:c.name});celebrate(c.pts)});
 on('#newReward',()=>sheet(`<h2>New prize</h2><label>Prize</label><input id="rn" placeholder="Pick the movie"><label>Cost (points)</label><input id="rc" type="number" inputmode="numeric" value="100">`,()=>{if(!val('rn'))return false;save('rewards',{id:uid(),name:val('rn'),cost:+val('rc')||100})}));
 on('[data-redeem]',async e=>{const r=S.rewards.find(x=>x.id===e.dataset.redeem);if(stats().bal<r.cost||!confirm(`Unlock "${r.name}" for ${r.cost} team points?`))return;await plog('redeem',0,{name:r.name,cost:r.cost});celebrate('🎁')});
 on('[data-thx]',e=>sendThanks(e.dataset.thx,e.dataset.txt));on('#nudgeX',()=>{localStorage.nudgeShown='closed';R()});on('#recapX',()=>{localStorage.recapSeen=String(+weekStart(Date.now()));R()});on('#pickMonth',pickMonth);
 on('[data-chstart]',e=>F.setDoc(dref('meta','settings'),{challenge:{id:e.dataset.chstart,start:Date.now()}},{merge:true}));on('#quitCh',()=>confirm('Stop this challenge?')&&F.setDoc(dref('meta','settings'),{challenge:null},{merge:true}));
 on('#pushGo',enablePush);on('#pushGo2',enablePush);on('#pushOff',()=>confirm('Turn off notifications on this phone?')&&disablePush());on('#pushHide',()=>{localStorage.pushHide=1;R()});
 on('#saveNudge',()=>F.setDoc(dref('meta','settings'),{nudge:{[S.me]:{on:$('#nOn').value==='1',time:$('#nT').value||'08:00'}}},{merge:true}).then(()=>celebrate('Saved')));
 on('#seedR',async()=>{for(const [n,c] of [['🍿 Movie night',150],['🥡 Takeout night',300],['🍦 Ice cream run',100],['💑 Date night out',500],['😴 Sleep-in Saturday',250]])await save('rewards',{id:uid(),name:n,cost:c})});
 on('#saveG',()=>F.setDoc(dref('meta','settings'),{goal:+val('tg')||300},{merge:true}));
 on('[data-rdel]',e=>del('rewards',e.dataset.rdel));
 on('#seedM',async()=>{for(const [n,d] of MDEF)await save('maint',{id:uid(),name:n,every:d,last:''})});
 on('[data-mt]',e=>editMaint(S.maint.find(x=>x.id===e.dataset.mt)));on('#newMaint',()=>editMaint());
 on('[data-mdone]',async e=>{const m=S.maint.find(x=>x.id===e.dataset.mdone);await save('maint',{...m,last:today()});await plog('maint',P.maint,{name:m.name});celebrate(P.maint)});
 on('#newIdea',()=>sheet(`<h2>Date idea</h2><input id="in" placeholder="Picnic at Cypress Creek park">`,()=>{if(!val('in'))return false;save('ideas',{id:uid(),text:val('in'),done:false})}));
 on('[data-idone]',e=>save('ideas',{...S.ideas.find(x=>x.id===e.dataset.idone),done:true}));on('[data-idel]',e=>del('ideas',e.dataset.idel));
 on('#pickIdea',()=>{const L=S.ideas.filter(i=>!i.done);if(!L.length){$('#pick').textContent='Add some ideas first 💡';return}let n=0;const t=setInterval(()=>{if(!$('#pick'))return clearInterval(t);$('#pick').textContent=L[Math.floor(Math.random()*L.length)].text;if(++n>12){clearInterval(t);celebrate('💑')}},90)});
 on('#addAnniv',()=>editDate({name:'Our anniversary',yearly:true}));
 on('[data-dt]',e=>editDate(S.dates.find(x=>x.id===e.dataset.dt)));on('#newDate',()=>editDate());
}

document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
